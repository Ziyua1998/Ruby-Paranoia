<script>
const entries=[
["■年6月6日",["命运将一个拥有红宝石般眼眸的猎人送至我面前。他的血液出乎意料地难以入口，不过，那顽强的自愈之力，以及「小刀」前所未有的悸动，都昭示了他的不同寻常。","姑且尝试一次“初拥”的仪式吧。","或许，我终于能够塑造出自己一直寻找的某种可能。","就称他为“66号”。"]],
["■年7月20日",["一个多月过去，66号的转化已经基本稳定。更令人惊讶的是，他竟然能够沐浴阳光而毫发无伤。","这超越了我对血族的认知。","他拥有远比我最初预想中更加惊人的潜质。或许是时候让他知道，作为我的后裔究竟应该成为什么样的人了。","我要让他足够强大，强大到再也不会轻易被谁伤害，最终成为能够与我并肩的存在。","至于为此必须经历的那些痛苦……","总有一天，他会理解的吧。"]],
["■年8月27日",["真让人发愁。","这段时间，66号越来越习惯城堡里的生活，却没有因此变得更加听话。他还是会偷偷离开，会把武器藏在我找不到的地方，也依然毫不掩饰自己想杀我的念头。","今天的事情更是荒唐。","他一定是在外面与那些粗鄙之徒厮混惯了，才会如此不知廉耻地张开腿给我看。","而我大概也疯了。","看见他的脸，就无法保持理智。","或许真的是那杯被动过手脚的血液在作祟。","可他的身体、声音、气味，甚至那双充满憎恨地盯着我的眼睛，都让我感到一种久违的灼热。"]],
["■年9月12日",["最近，66号偶尔会允许我留在他的房间。","说是“允许”或许并不准确。他只是懒得再把我赶出去，仍旧会在床底藏着武器，也从没有停止提防我。","睡着的时候倒是很安静。","有时我会想，如果「你」能够活到今日，或许也已经是这样的年纪。","可是你属于阳光。","像我这样背负罪孽的怪物，从来没有资格奢望你留在身边。","而66号就在这里。","我伸手便能够碰到他。","有那么一刻，我竟然对所谓的命运生出了感谢。"]],
["■年10月16日",["无论我如何做，66号始终不肯真正屈从。","我原本以为，只要给予足够的力量、足够长久的生命，以及任何人都无法夺走的地位，他迟早会理解我的选择。","看来是我想错了。","如果他真的如此厌恶我，在那座废弃教堂里，在鬼神共同注视的祭坛前，又为什么主动吻我？","更让我无法理解的是，在那之后，他明明已经得到离开的机会，却还是留了下来。","他究竟在想什么？","我已经越来越看不懂他了。"]],
["■年10月31日",["66号仍旧没有离开。","他开始插手血仆的去留，干涉协会的事务，甚至对我该不该杀人指手画脚。有时候我会觉得，我培养的根本不是什么听话的后裔，而是一个专门与我作对的麻烦。","可我似乎已经习惯了这个麻烦。","还有很多事情没有完成。","手臂上来自恶魔的印记时时刻刻提醒着我，我能够维持自己意志的时间并不会无限延长。","在“大蛇”真正吞噬我以前，我必须让66号拥有能够独自活下去的力量。"]],
["■年12月15日",["冬天已经来了。","城堡比过去安静许多。那些孩子陆续离开以后，走廊里再也听不到从前那样杂乱的脚步声。66号倒还是一样，偶尔回来，偶尔消失，仿佛从来不觉得有向我说明去处的必要。","我最真实的愿望，不过是他能够保护自己。","活得比任何人都久一些。","如果还能继续像现在这样，对那些孩子露出笑容，那就更好了。","曾经，我也这样希望过「你」。","说到底，我仍然只是那个无法以真正面目示人的怪物，只能靠着过去的回忆勉强生活。","我曾以为自己能够塑造66号。","如今看来，或许恰恰相反。","他正在变成一个连我也无法控制的人。","这大概也是好事。","我能够为他做的，或许只剩下一件事——成为他走向不朽之前的一块踏脚石。","即使最后因此万劫不复。","「你」如果能够看见今日的我，会不会也觉得这样的感情十分可悲？"]]
];
const titles={"/":"RUBY PARANOIA（深红偏执）— Zenobia","/world/":"世界观设定 — RUBY PARANOIA · Zenobia","/media/":"歌曲与视频 — RUBY PARANOIA · Zenobia","/extras/":"附录与番外 — RUBY PARANOIA · Zenobia","/extras/diary/":"甜美公爵的私人日记 — RUBY PARANOIA · Zenobia"};

function shell(content){return `<div class="site"><header class="topbar"><a class="brand" href="/"><strong>RUBY PARANOIA</strong><small>深红偏执 · ZENOBIA</small></a><nav class="nav">${navLink('/','首页')}${navLink('/world/','世界观')}${navLink('/media/','歌曲·视频')}${navLink('/extras/','番外')}</nav><div class="actions"><button class="icon-btn" data-share aria-label="分享">↗</button><button class="icon-btn menu-btn" data-menu aria-label="菜单">☰</button></div><nav class="mobile-nav" hidden>${navLink('/','首页')}${navLink('/world/','世界观')}${navLink('/media/','歌曲·视频')}${navLink('/extras/','番外')}</nav></header><main class="main">${content}</main><footer class="footer"><span>RUBY PARANOIA · Zenobia</span><span>Fanwork / One Punch Man fanfiction</span></footer></div>`}
function home(){return `<section class="hero"><div class="hero-architecture"><i></i><i></i><i></i></div><div class="hero-copy"><div class="eyebrow">A GOTHIC FANWORK BY ZENOBIA</div><h1><span>Ruby</span><span>Paranoia</span></h1><h2>深红偏执</h2><div class="rule"></div><p>这是一个围绕吸血鬼、猎人、记忆、控制与选择展开的 One Punch Man 同人故事。</p><div class="hero-meta"><span>AMAI MASK × ZOMBIEMAN</span><b>◆</b><span>ONGOING</span></div><a class="enter-link" href="#archive">ENTER THE ARCHIVE <span>↓</span></a></div><figure class="hero-cover"><div class="book-frame"><div class="cover-art"><span class="cover-by">By Zenobia</span><div class="cover-title">Ruby<br>Paranoia</div><div class="cover-sword"><i></i></div><div class="cover-bats"><b></b><b></b><b></b></div><span class="cover-sub">AMAI MASK × ZOMBIEMAN<br>ONE PUNCH MAN FANBOOK</span></div></div><figcaption>BOOK DESIGN · ZENOBIA</figcaption></figure></section><section class="manifesto"><div class="manifesto-mark">✦</div><p>“红宝石”既是记忆的残片，也是无法被安静埋葬的偏执。这里收录正文之外的世界设定、音乐影像与番外档案。</p></section><section class="section" id="archive"><div class="section-title"><span>ARCHIVE INDEX</span><h2>作品档案</h2><p>Choose a sealed file</p></div><div class="portal-grid"><a class="card" href="/world/"><span class="n">01</span><div class="sigil">♜</div><small>WORLD ARCHIVE</small><h3>世界观设定</h3><p>血族秩序、人类势力与既有规则档案。</p><span class="go">阅览档案 →</span></a><a class="card" href="/media/"><span class="n">02</span><div class="sigil">◉</div><small>MEDIA VAULT</small><h3>歌曲 / 视频</h3><p>与作品相关的声音与影像陈列。</p><span class="go">阅览档案 →</span></a><a class="card" href="/extras/"><span class="n">03</span><div class="sigil">✒</div><small>EXTRA FILES</small><h3>附录与番外</h3><p>主线之外，被封存的故事与私人记录。</p><span class="go">阅览档案 →</span></a><a class="card" href="/extras/diary/"><span class="n">04</span><div class="sigil">▣</div><small>PRIVATE DIARY</small><h3>甜公日记</h3><p>翻阅甜美公爵留下的羊皮纸私人日记。</p><span class="go">阅览档案 →</span></a></div></section><section class="book-object"><div class="book-object-copy"><span>PHYSICAL EDITION CONCEPT</span><h2>像一本被遗忘在古堡里的书。</h2><p>网页视觉从小说封面延伸：黑色作为空间，深红作为血液与执念，暗金作为烛火、旧金属与纸张边缘的光。</p></div><div class="book-object-visual"><div class="mock-book mock-book-back"><span>RUBY PARANOIA</span></div><div class="mock-book mock-book-spine"><span>Ruby Paranoia</span></div><div class="mock-book mock-book-front"><span class="tiny">BY ZENOBIA</span><strong>Ruby<br>Paranoia</strong></div></div></section>`}
function world(){const rows=[["I","♛","血族秩序","血族社会存在“长亲—后裔—血仆”等关系结构。","不同血族对人类立场并不一致：有力量统治派，也有强调力量与责任对应、维持族群平衡的一派。甜美公爵处在两者之间，认为利用人类可以接受，但必须受到约束。"],["II","⛨","人类势力","人类侧存在教会、骑士团、血猎／猎人组织等力量。","这些势力与血族彼此对立，却也并非铁板一块。"],["III","✦","初拥与后裔","“初拥”会把人类转化为血族后裔。","66号是甜美公爵第一个成功完成初拥并存活的人类，并保留了日光耐受与强自愈等异常特性。"],["IV","◆","血液与生存","血族获取血液的方式包括收买血仆、圈养人畜、外出捕猎，以及介入人类战争。",""],["V","♜","权力结构","血族协会由玛考伊建立，本部位于 V 市。","协会通过议会协调血族精英，并输出可能影响人类命运的决策。"]];return `<article class="page"><header class="page-title"><div class="eyebrow">WORLD DOSSIER · ZENOBIA</div><h1>世界观设定</h1><p>现阶段已确认的秩序、阵营与生存法则。</p></header><div class="dossiers">${rows.map(r=>`<section class="dossier"><header><span>${r[0]}</span><span>${r[1]}</span></header><h2>${r[2]}</h2><p>${r[3]}</p>${r[4]?`<p>${r[4]}</p>`:''}</section>`).join('')}</div><p class="note">以正文为准，后续随连载更新。</p></article>`}
function media(){return `<div class="page"><header class="page-title"><div class="eyebrow">SOUND & VISION · ZENOBIA</div><h1>歌曲 / 视频</h1><p>声音与影像将在此处依次归档。</p></header><div class="media-grid"><section class="media-box"><div class="media-art">◉</div><div><span>SECTION I · AUDIO</span><h2>歌曲</h2><p>档案尚未公开</p><small>COMING SOON</small></div></section><section class="media-box"><div class="media-art film">▤</div><div><span>SECTION II · FILM</span><h2>视频</h2><p>影像卷宗仍在封存</p><small>COMING SOON</small></div></section></div></div>`}
function extras(){return `<div class="page"><header class="page-title"><div class="eyebrow">APPENDICES · ZENOBIA</div><h1>附录与番外档案</h1><p>主线之外，仍被纸页与封蜡保存的记录。</p></header><div class="extras"><a class="extra featured" href="/extras/diary/"><span class="idx">EX — 01</span><span class="glyph">▣</span><div><small>可阅览档案</small><h2>甜美公爵的私人日记</h2><p>以可翻阅的中世纪羊皮纸日记形式呈现的私人记录。</p></div><span class="state">开启日记 →</span></a><article class="extra"><span class="idx">EX — 02</span><span class="glyph">⚿</span><div><small>番外档案</small><h2>井中的新娘</h2><p>一段发生在主线之前的旧事，关于被凝视、被安排的人生，与一次拒绝。</p></div><span class="state">封存</span></article><article class="extra muted"><span class="idx">EX — ··</span><span class="glyph">◌</span><div><small>待归档</small><h2>更多番外</h2><p>将随连载补充。</p></div></article></div></div>`}
function diary(){let pages=[];entries.forEach(([d,ps],ei)=>{const cut=Math.ceil(ps.length/2);pages.push(`<div class="page-face ${ei===0?'back':'front'}"><article class="paper"><h2>＜${d}＞</h2>${ps.slice(0,cut).map(p=>`<p>${p}</p>`).join('')}</article></div>`);pages.push(`<div class="page-face ${ei===entries.length-1?'front':'back'}"><article class="paper">${ps.slice(cut).map(p=>`<p>${p}</p>`).join('')}</article></div>`)});let sheets=`<div class="sheet"><div class="page-face front book-cover-face"><div class="cover-inner"><h1>甜美公爵的<br>私人日记</h1><div class="ruby"></div></div></div>${pages[0]}</div>`;for(let i=1;i<pages.length;i+=2){sheets+=`<div class="sheet">${pages[i]||'<div class="page-face front"></div>'}${pages[i+1]||'<div class="page-face back"></div>'}</div>`}sheets+=`<div class="sheet"><div class="page-face front"></div><div class="page-face back book-cover-face"></div></div>`;return `<main class="diary-shell"><a class="diary-return" href="/extras/">← 返回番外</a><section class="book-wrap"><div class="book closed">${sheets}</div></section><p class="page-status">封面</p></main>`}
const app=document.getElementById('app');if(path==='/extras/diary/'){app.innerHTML=diary();initDiary()}else{let c=path==='/world/'?world():path==='/media/'?media():path==='/extras/'?extras():home();app.innerHTML=shell(c);initSite()}
function initSite(){const s=document.querySelector('[data-share]');if(s)s.onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,text:'RUBY PARANOIA · Zenobia',url:location.href});else{await navigator.clipboard.writeText(location.href);s.textContent='✓';setTimeout(()=>s.textContent='↗',1500)}}catch(e){}};const m=document.querySelector('[data-menu]'),n=document.querySelector('.mobile-nav');if(m&&n)m.onclick=()=>{n.hidden=!n.hidden;m.textContent=n.hidden?'☰':'×'}}
function initDiary(){const book=document.querySelector('.book'),sheets=[...document.querySelectorAll('.sheet')],status=document.querySelector('.page-status');let cur=0,drag=false,start=0;sheets.forEach((s,i)=>s.style.zIndex=String(sheets.length-i));const render=()=>{sheets.forEach((s,i)=>{const f=i<cur;s.classList.toggle('flipped',f);s.style.zIndex=f?String(i+1):String(sheets.length-i)});book.classList.toggle('closed',cur===0||cur===sheets.length);status.textContent=cur===0?'封面':cur>=sheets.length-1?'空白页':`${cur} / ${sheets.length-1}`};const next=()=>{if(cur<sheets.length-1){cur++;render()}},prev=()=>{if(cur>0){cur--;render()}};book.onclick=e=>{if(drag)return;const r=book.getBoundingClientRect();e.clientX-r.left>r.width/2?next():prev()};book.onpointerdown=e=>{drag=false;start=e.clientX};book.onpointermove=e=>{if(Math.abs(e.clientX-start)>12)drag=true};book.onpointerup=e=>{const dx=e.clientX-start;if(Math.abs(dx)>45)(dx<0?next():prev());setTimeout(()=>drag=false,0)};window.onkeydown=e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()};let tx=0;book.ontouchstart=e=>tx=e.touches[0].clientX;book.ontouchend=e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>35)(dx<0?next():prev())};render()}
</script></body></html>
