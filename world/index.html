const entries=[
["■年6月6日",["命运将一个拥有红宝石般眼眸的猎人送至我面前。他的血液出乎意料地难以下咽，可那顽强的自愈能力，以及「小刀」从未有过的反应，都昭示了他的不同寻常。","姑且一试那“初拥”的仪式吧。或许，就能塑造出我自己一直寻找的某种可能。","就称他为“66号”。"]],
["■年7月20日",["一个多月了才发现，66号竟然能够沐浴在阳光下而毫发无伤，这超越了我对血族的认知，也让我看到了他惊人的潜质。或许是时候让他知晓，身为我的后裔所要肩负的真正使命了。","我要将他打造成这永夜中最美丽的杰作，培养成足以与我并肩，维护这世间正义的存在。至于为这份‘恩赐’必须经历的那些痛苦……总有一天，他会理解的。"]],
["■年8月27日",["真让人发愁。66号还是想杀我。","今天的事更是荒唐。他一定与和外面的那些粗鄙之徒厮混惯了，才会如此不知廉耻地张开腿给我看。而我大概也是疯了，只要看见他的脸，就无法自持。","或许真是那杯被动过手脚的血液在作祟。","但他的身体、声音、气味，乃至充满憎恨的眼神，都让我感受到一种久违的灼热……"]],
["■年9月12日",["最近，66号偶尔会允许我留在他的房间，不过也从没有停止提防我。","他睡着的时候倒很安静。那让我想起，如果「你」活到今天，大概也会是这般模样。","但「你」属于阳光，是像我这样满身罪孽的怪物永远无法奢望的。而66号就躺在我触手可及的地方。有那么一刻，我对命运产生了荒谬的感激。"]],
["■年10月16日",["无论我如何做，66号始终不肯真正屈从。他真的如此厌恶我吗？若真是如此，在那座废弃的教堂里，在鬼神共同注视的祭坛上，他又为什么主动吻我？","算了。我已不想深究。那在暗处窥视的卑劣人类已经将我们的结合公之于众，今后，无论他是否情愿留在我身边，都将与我一同沉沦。"]],
["■年10月31日",["66号仍旧没有离开。有时候我会觉得，我培养了一个专门与我作对的麻烦。而我似乎已经习惯了。","还有太多的事要做。恶魔留下的痕迹时时刻刻提醒着我，自己的意志未必还能维持多久。在被“大蛇”完全吞噬之前，必须加快速度，为66号铺平道路……"]],
["■年12月15日",["我真正希望的，不过是66号能够保护自己，活得比任何人都久一些，继续对着那些小孩子露出笑容。这也是曾经我希望的「你」的人生。说到底，我还是那个始终不敢以真面目示人、靠着回忆饮鸩止渴的怪物。","我曾以为自己能够塑造66号，可如今恰恰相反，他正在变得更强大。我能替他做的，大概只剩下一件事——成为他通往不朽的踏脚石。即使我将万劫不复。","「你」倘若能看见今日的情景，是否也会为我这扭曲的感情，而感到悲哀？"]]
];

function bindMapHoverLayers(){
  const hotspots=[...document.querySelectorAll('.map-city-hotspot,.map-place-hotspot')];
  const activate=el=>{
    hotspots.forEach(h=>{if(h!==el){h.classList.remove('is-active');h.style.zIndex=''}});
    el.classList.add('is-active');
    el.style.zIndex='10000';
  };
  const deactivate=el=>{
    el.classList.remove('is-active');
    el.style.zIndex='';
  };
  hotspots.forEach(el=>{
    el.addEventListener('pointerenter',()=>activate(el));
    el.addEventListener('mouseenter',()=>activate(el));
    el.addEventListener('pointerleave',()=>deactivate(el));
    el.addEventListener('mouseleave',()=>deactivate(el));
    el.addEventListener('focus',()=>activate(el));
    el.addEventListener('blur',()=>deactivate(el));
  });
}

function initDiary(){
  const shell=document.querySelector('.diary-shell');
  const book=document.getElementById('diary-book');
  const status=document.querySelector('.page-status');
  if(!book)return;

  // 1) Paginate the diary using the actual rendered handwriting font and page height.
  const measure=document.createElement('div');
  measure.className='diary-page right diary-measure';
  measure.innerHTML='<div class="paper-grain"></div><article class="diary-paper"><div class="diary-flow"></div></article>';
  document.body.appendChild(measure);
  const measureFlow=measure.querySelector('.diary-flow');
  const measurePaper=measure.querySelector('.diary-paper');
  const fits=html=>{measureFlow.innerHTML=html;return measurePaper.scrollHeight<=measurePaper.clientHeight+1};

  const pageHTML=[];
  let blocks=[];
  const flush=()=>{if(blocks.length){pageHTML.push(blocks.join(''));blocks=[]}};
  const tryAdd=html=>{const candidate=blocks.concat(html).join('');if(fits(candidate)){blocks.push(html);return true}return false};

  const addParagraph=(raw)=>{
    let text=raw;
    const whole='<p>'+text+'</p>';
    if(tryAdd(whole))return;
    if(blocks.length){
      const chars=Array.from(text);let lo=1,hi=chars.length,best=0;
      while(lo<=hi){const mid=(lo+hi)>>1;const h='<p>'+chars.slice(0,mid).join('')+'</p>';if(fits(blocks.concat(h).join(''))){best=mid;lo=mid+1}else hi=mid-1}
      if(best>0){
        let cut=best;const from=Math.max(0,Math.floor(best*.68));const probe=chars.slice(from,best).join('');
        const m=[...probe.matchAll(/[，。！？；、…]/g)];if(m.length)cut=from+m[m.length-1].index+1;
        blocks.push('<p>'+chars.slice(0,cut).join('')+'</p>');flush();text=chars.slice(cut).join('');
      }else flush();
    }
    while(text){
      const chars=Array.from(text);
      if(tryAdd('<p class="continued">'+text+'</p>'))break;
      let lo=1,hi=chars.length,best=0;
      while(lo<=hi){const mid=(lo+hi)>>1;const h='<p class="continued">'+chars.slice(0,mid).join('')+'</p>';if(fits(blocks.concat(h).join(''))){best=mid;lo=mid+1}else hi=mid-1}
      if(best<=0){flush();continue}
      let cut=best;const from=Math.max(0,Math.floor(best*.68));const probe=chars.slice(from,best).join('');
      const m=[...probe.matchAll(/[，。！？；、…]/g)];if(m.length)cut=from+m[m.length-1].index+1;
      blocks.push('<p class="continued">'+chars.slice(0,cut).join('')+'</p>');flush();text=chars.slice(cut).join('');
    }
  };

  entries.forEach(([date,paras])=>{
    const heading='<h2 class="diary-date">＜'+date+'＞</h2>';
    const first=paras[0]||'';
    const firstGroup=heading+(first?'<p>'+first+'</p>':'');
    if(!tryAdd(firstGroup)){flush();if(!tryAdd(firstGroup)){blocks.push(heading);if(first)addParagraph(first)}}
    for(let i=1;i<paras.length;i++)addParagraph(paras[i]);
  });
  flush();measure.remove();

  // 2) Turn the resulting physical pages into right-hand "sheets":
  // cover(front) / p1(back), then p2(front)/p3(back), etc.
  const physical=pageHTML.map((html,i)=>({
    html,number:i+1,blank:false,
    season:(i/Math.max(1,pageHTML.length-1))>.82?'winter':(i/Math.max(1,pageHTML.length-1))>.48?'autumn':(i/Math.max(1,pageHTML.length-1))>.26?'late-summer':'summer'
  }));
  if(physical.length%2===1)physical.push({html:'',number:null,blank:true,season:'winter'});
  physical.push({html:'',number:null,blank:true,season:'winter'},{html:'',number:null,blank:true,season:'winter'});

  const face=(p,side,back=false)=>{
    if(!p)return '<div class="diary-face '+(back?'back ':'front ')+'diary-page diary-blank"></div>';
    const cls='diary-face '+(back?'back ':'front ')+'diary-page '+side+(p.blank?' diary-blank':'');
    return '<div class="'+cls+'" data-season="'+p.season+'"><div class="paper-grain"></div><article class="diary-paper">'+(p.html?'<div class="diary-flow">'+p.html+'</div>':'')+'</article>'+(p.number?'<span class="folio">'+p.number+'</span>':'')+'</div>';

  const coverSheet=document.createElement('div');
  coverSheet.className='diary-sheet';
  coverSheet.innerHTML='<div class="diary-face front diary-cover"><div class="diary-cover-inner"><small>PRIVATE RECORD · ZENOBIA</small><h1>甜公的日记</h1><div class="diary-ruby"></div></div></div>'+face(physical[0],'left',true)+'<i class="diary-corner right"></i>';
  book.appendChild(coverSheet);

  for(let i=1;i<physical.length;i+=2){
    const sheet=document.createElement('div');
    sheet.className='diary-sheet';
    sheet.innerHTML=face(physical[i],'right',false)+face(physical[i+1],'left',true)+'<i class="diary-corner right"></i><i class="diary-corner left"></i>';
    book.appendChild(sheet);
  }

  const sheets=[...book.querySelectorAll('.diary-sheet')];
  let cur=0,dragging=false,dragSheet=null,startX=0,startSide='',moved=0;
  const spreadFor=()=>{
    if(cur===0)return {label:'封面',season:'summer'};
    const leftNo=(cur-1)*2+1,rightNo=leftNo+1;
    if(leftNo>pageHTML.length)return {label:'空白页',season:'winter'};
    const p=physical[Math.min(leftNo-1,physical.length-1)];
    return {label:Math.min(rightNo,pageHTML.length)+' / '+pageHTML.length,season:p?.season||'summer'};
  };
  const render=()=>{
    sheets.forEach((s,i)=>{
      const flipped=i<cur;
      s.classList.toggle('flipped',flipped);
      if(!s.classList.contains('dragging'))s.style.transform=flipped?'rotateY(-180deg)':'rotateY(0deg)';
      s.style.zIndex=flipped?String(i+1):String(sheets.length-i);
    });
    book.classList.toggle('closed',cur===0);
    const info=spreadFor();status.textContent=info.label;shell.className='diary-shell season-'+info.season;
  };
  const next=()=>{if(cur<sheets.length){cur++;render()}};
  const prev=()=>{if(cur>0){cur--;render()}};

  const pointX=e=>e.touches?e.touches[0].clientX:e.clientX;
  const down=e=>{
    const r=book.getBoundingClientRect(),x=pointX(e)-r.left;
    startX=pointX(e);moved=0;
    const mobile=matchMedia('(max-width:850px)').matches;
    const rightHalf=mobile?x>r.width*.35:x>r.width/2;
    if(rightHalf&&cur<sheets.length){dragSheet=sheets[cur];startSide='next'}
    else if(!rightHalf&&cur>0){dragSheet=sheets[cur-1];startSide='prev'}
    else return;
    dragging=true;dragSheet.classList.add('dragging');dragSheet.style.zIndex=String(sheets.length+10);
    if(e.pointerId!=null)book.setPointerCapture?.(e.pointerId);
  };
  const move=e=>{
    if(!dragging||!dragSheet)return;
    const dx=pointX(e)-startX;moved=Math.max(moved,Math.abs(dx));
    const w=book.getBoundingClientRect().width*(matchMedia('(max-width:850px)').matches?1:.5);
    if(startSide==='next'){
      const angle=Math.max(-180,Math.min(0,(dx/w)*180));
      dragSheet.style.transform='rotateY('+angle+'deg)';
    }else{
      const angle=-180+Math.max(0,Math.min(180,(dx/w)*180));
      dragSheet.style.transform='rotateY('+angle+'deg)';
    }
    e.preventDefault?.();
  };
  const up=e=>{
    if(!dragging||!dragSheet)return;
    const dx=(e.changedTouches?e.changedTouches[0].clientX:e.clientX)-startX;
    const threshold=book.getBoundingClientRect().width*(matchMedia('(max-width:850px)').matches?.16:.10);
    dragSheet.classList.remove('dragging');dragSheet.style.transform='';
    if(startSide==='next'&&dx<-threshold)cur=Math.min(sheets.length,cur+1);
    else if(startSide==='prev'&&dx>threshold)cur=Math.max(0,cur-1);
    dragging=false;dragSheet=null;render();
  };

  book.addEventListener('pointerdown',down);
  book.addEventListener('pointermove',move);
  book.addEventListener('pointerup',up);
  book.addEventListener('pointercancel',up);
  book.addEventListener('click',e=>{
    if(moved>10)return;
    const r=book.getBoundingClientRect(),x=e.clientX-r.left;
    if(matchMedia('(max-width:850px)').matches||x>r.width/2)next();else prev();
  });
  window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
  render();
}
</script><script src="/assets/music-player.js?v=20260929-3" defer></script>
