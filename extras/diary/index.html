const entries=[
["■年6月6日",["命运将一个拥有红宝石般眼眸的猎人送至我面前。他的血液出乎意料地难以下咽，可那顽强的自愈能力，以及「小刀」从未有过的反应，都昭示了他的不同寻常。","姑且一试那“初拥”的仪式吧。或许，就能塑造出我自己一直寻找的某种可能。","就称他为“66号”。"]],
["■年7月20日",["一个多月了才发现，66号竟然能够沐浴在阳光下而毫发无伤，这超越了我对血族的认知，也让我看到了他惊人的潜质。或许是时候让他知晓，身为我的后裔所要肩负的真正使命了。","我要将他打造成这永夜中最美丽的杰作，培养成足以与我并肩，维护这世间正义的存在。至于为这份‘恩赐’必须经历的那些痛苦……总有一天，他会理解的。"]],
["■年8月27日",["真让人发愁。66号还是想杀我。","今天的事更是荒唐。他一定与和外面的那些粗鄙之徒厮混惯了，才会如此不知廉耻地张开腿给我看。而我大概也是疯了，只要看见他的脸，就无法自持。","或许真是那杯被动过手脚的血液在作祟。","但他的身体、声音、气味，乃至充满憎恨的眼神，都让我感受到一种久违的灼热……"]],
["■年9月12日",["最近，66号偶尔会允许我留在他的房间，不过也从没有停止提防我。","他睡着的时候倒很安静。那让我想起，如果「你」活到今天，大概也会是这般模样。","但「你」属于阳光，是像我这样满身罪孽的怪物永远无法奢望的。而66号就躺在我触手可及的地方。有那么一刻，我对命运产生了荒谬的感激。"]],
["■年10月16日",["无论我如何做，66号始终不肯真正屈从。他真的如此厌恶我吗？若真是如此，在那座废弃的教堂里，在鬼神共同注视的祭坛上，他又为什么主动吻我？","算了。我已不想深究。那在暗处窥视的卑劣人类已经将我们的结合公之于众，今后，无论他是否情愿留在我身边，都将与我一同沉沦。"]],
["■年10月31日",["66号仍旧没有离开。有时候我会觉得，我培养了一个专门与我作对的麻烦。而我似乎已经习惯了。","还有太多的事要做。恶魔留下的痕迹时时刻刻提醒着我，自己的意志未必还能维持多久。在被“大蛇”完全吞噬之前，必须加快速度，为66号铺平道路……"]],
["■年12月15日",["我真正希望的，不过是66号能够保护自己，活得比任何人都久一些，继续对着那些小孩子露出笑容。这也是曾经我希望的「你」的人生。说到底，我还是那个始终不敢以真面目示人、靠着回忆饮鸩止渴的怪物。","我曾以为自己能够塑造66号，可如今恰恰相反，他正在变得更强大。我能替他做的，大概只剩下一件事——成为他通往不朽的踏脚石。即使我将万劫不复。","「你」倘若能看见今日的情景，是否也会为我这扭曲的感情，而感到悲哀？"]]
];

     while(lo<=hi){const mid=(lo+hi)>>1;if(fits(blocks.concat('<p class="continued">'+ch.slice(0,mid).join('')+'</p>').join(''))){best=mid;lo=mid+1}else hi=mid-1}
     if(best<=0){flush();continue}
     let cut=best,from=Math.max(0,Math.floor(best*.68)),probe=ch.slice(from,best).join(''),mm=[...probe.matchAll(/[，。！？；、…]/g)];if(mm.length)cut=from+mm[mm.length-1].index+1;
     blocks.push('<p class="continued">'+ch.slice(0,cut).join('')+'</p>');flush();text=ch.slice(cut).join('');
   }
 }
 entries.forEach(([date,ps])=>{const head='<h2>＜'+date+'＞</h2>',first=ps[0]||'',group=head+(first?'<p>'+first+'</p>':'');if(!addRaw(group)){flush();if(!addRaw(group)){blocks.push(head);if(first)addPara(first)}}for(let i=1;i<ps.length;i++)addPara(ps[i])});
 flush();m.remove();

 const physical=pages.map((html,i)=>({html,num:i+1,blank:false}));
 if(physical.length%2===1)physical.push({html:'',num:null,blank:true});
 physical.push({html:'',num:null,blank:false,doodle:true},{html:'',num:null,blank:true});

 const face=(p,back=false)=>'<div class="face '+(back?'back ':'front ')+'page'+(p&&p.blank?' blank':'')+(p&&p.doodle?' doodle-page':'')+'"><article class="paper">'+(p&&p.doodle?'<img class="doodle" src="'+doodle+'" alt="铅笔涂鸦">':(p&&p.html?'<div class="flow">'+p.html+'</div>':''))+'</article>'+(p&&p.num?'<span class="folio">'+p.num+'</span>':'')+'</div>';
 book.innerHTML='';
 const first=document.createElement('div');first.className='sheet';
 first.innerHTML='<div class="face front cover"><div class="cover-inner"><small>PRIVATE RECORD · ZENOBIA</small><h1>甜公的日记</h1><div class="ruby"></div></div></div>'+face(physical[0],true)+'<i class="corner right"></i>';book.appendChild(first);
 for(let i=1;i<physical.length;i+=2){const s=document.createElement('div');s.className='sheet';s.innerHTML=face(physical[i],false)+face(physical[i+1],true)+'<i class="corner right"></i><i class="corner left"></i>';book.appendChild(s)}

 const sheets=[...book.querySelectorAll('.sheet')];let cur=0,startX=0,active=null,mode='',moved=0;
 function render(){
   sheets.forEach((s,i)=>{const f=i<cur;s.classList.toggle('flipped',f);if(!s.classList.contains('dragging'))s.style.transform=f?'rotateY(-180deg)':'rotateY(0deg)';s.style.zIndex=f?String(i+1):String(sheets.length-i)});
   book.classList.toggle('closed',cur===0);
   status.textContent=cur===0?'封面':((cur-1)*2+1>pages.length?'空白页':Math.min(cur*2,pages.length)+' / '+pages.length);
 }
 const next=()=>{if(cur<sheets.length){cur++;render()}},prev=()=>{if(cur>0){cur--;render()}};
 const px=e=>e.clientX;
 book.addEventListener('pointerdown',e=>{const r=book.getBoundingClientRect(),x=px(e)-r.left;startX=px(e);moved=0;const mobile=innerWidth<=850,right=mobile?x>r.width*.35:x>r.width/2;if(right&&cur<sheets.length){active=sheets[cur];mode='next'}else if(!right&&cur>0){active=sheets[cur-1];mode='prev'}else return;active.classList.add('dragging');active.style.zIndex=String(sheets.length+5);book.setPointerCapture?.(e.pointerId)});
 book.addEventListener('pointermove',e=>{if(!active)return;const dx=px(e)-startX;moved=Math.max(moved,Math.abs(dx));const w=book.getBoundingClientRect().width*(innerWidth<=850?1:.5);if(mode==='next')active.style.transform='rotateY('+Math.max(-180,Math.min(0,dx/w*180))+'deg)';else active.style.transform='rotateY('+(-180+Math.max(0,Math.min(180,dx/w*180)))+'deg)'});
 const end=e=>{if(!active)return;const dx=px(e)-startX,thr=book.getBoundingClientRect().width*(innerWidth<=850 ? .16 : .10);active.classList.remove('dragging');active.style.transform='';if(mode==='next'&&dx<-thr)cur=Math.min(sheets.length,cur+1);else if(mode==='prev'&&dx>thr)cur=Math.max(0,cur-1);active=null;render()};
 book.addEventListener('pointerup',end);book.addEventListener('pointercancel',end);
 book.addEventListener('click',e=>{if(moved>10)return;const r=book.getBoundingClientRect(),x=e.clientX-r.left;if(innerWidth<=850||x>r.width/2)next();else prev()});
 addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
 render();
}
init();
</script>
