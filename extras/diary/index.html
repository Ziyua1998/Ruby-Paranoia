<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>甜美公爵的私人日记 — RUBY PARANOIA · Zenobia</title>
<meta name="description" content="RUBY PARANOIA 番外：甜美公爵的私人日记">
<meta name="author" content="Zenobia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8b754;--red:#700915;--paper:#dec78e;--ink:#2a1712;--hand:"Ma Shan Zheng","STKaiti","KaiTi",cursive}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050304}
body{overflow:hidden;font-family:"Noto Serif SC","Songti SC",serif}
.diary-shell{min-height:100svh;display:grid;grid-template-rows:minmax(0,1fr) 28px;place-items:center;padding:24px 12px 8px;position:relative;overflow:hidden;background:
radial-gradient(circle at 50% 42%,rgba(145,4,23,.18),transparent 44%),
linear-gradient(105deg,#050304,#16070a 48%,#040304)}
.diary-shell:before{content:"";position:absolute;inset:0;pointer-events:none;background:
repeating-linear-gradient(90deg,transparent 0 105px,rgba(95,10,20,.10) 106px 108px,transparent 109px 210px),
radial-gradient(circle at 12% 85%,rgba(232,160,43,.07),transparent 20%)}
.diary-return{position:fixed;left:12px;top:14px;z-index:500;color:var(--gold);font-size:12px;text-decoration:none;border-bottom:1px solid rgba(216,183,84,.28);padding:8px 10px;background:rgba(4,2,3,.48)}
.diary-hint{position:fixed;right:18px;top:18px;z-index:500;color:#7c6940;font-size:10px;letter-spacing:.12em}
.stage{position:relative;z-index:2;width:min(1080px,96vw);height:min(720px,calc(100svh - 62px));display:grid;place-items:center;perspective:2400px;filter:drop-shadow(0 28px 34px #000e)}
.book{position:relative;width:min(1000px,92vw);height:min(690px,calc(100svh - 82px));transform-style:preserve-3d;touch-action:pan-y;transition:width .45s ease}
.book.closed{width:min(500px,92vw)}
.sheet{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 900ms cubic-bezier(.2,.7,.2,1);will-change:transform}
.sheet.flipped{transform:rotateY(-180deg)}
.sheet.dragging{transition:none}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d}
.face.back{transform:rotateY(180deg)}
.page{color:var(--ink);background:
radial-gradient(circle at 14% 14%,rgba(96,57,25,.08) 0 3px,transparent 4px),
radial-gradient(circle at 84% 72%,rgba(90,48,20,.08) 0 9px,transparent 18px),
linear-gradient(95deg,#b5965d,#dec78e 7%,#e4d09d 53%,#b5965d);border-block:1px solid rgba(83,52,20,.55)}
.face.front.page:after,.face.back.page:after{content:"";position:absolute;top:0;bottom:0;width:40px;pointer-events:none}
.face.front.page:after{left:0;background:linear-gradient(90deg,rgba(44,24,14,.24),transparent)}
.face.back.page:after{right:0;background:linear-gradient(270deg,rgba(44,24,14,.24),transparent)}
.paper{position:relative;z-index:1;height:100%;padding:52px 48px 40px;overflow:hidden}
.flow{font-family:var(--hand)}
.flow h2{margin:26px 0 18px;color:#6b0f1c;font:400 23px/1.35 var(--hand);letter-spacing:.05em}
.flow h2:first-child{margin-top:0}
.flow p{margin:0 0 .72em;font:400 20px/1.78 var(--hand);letter-spacing:.015em;text-indent:2em}
.flow p.continued{text-indent:0}
.folio{position:absolute;z-index:2;bottom:18px;left:0;right:0;text-align:center;color:rgba(73,48,24,.45);font-size:9px}
.cover,.backcover{background:
radial-gradient(circle at 50% 34%,rgba(139,9,27,.34),transparent 38%),
linear-gradient(105deg,#030202,#3b0810 38%,#160508 70%,#030202);border:4px solid #020202;color:var(--gold);box-shadow:inset 0 0 0 2px #7e0a18,inset 0 0 0 4px #050303,inset 0 0 0 5px rgba(227,189,84,.48)}
.cover:before{content:"";position:absolute;inset:8%;border:1px solid rgba(227,189,84,.65)}
.cover-inner{position:absolute;inset:13%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-inner small{font-size:9px;letter-spacing:.18em;color:#a68a43}
.cover-inner h1{margin:24px 0 44px;font-size:clamp(29px,3.2vw,42px);line-height:1.65;color:#e5c65d;letter-spacing:.12em}
.ruby{width:48px;aspect-ratio:1;rotate:45deg;background:#760a17;border:5px ridge #a9802e;box-shadow:0 4px 14px #0008,inset 5px 5px 10px rgba(241,73,84,.18)}
.corner{position:absolute;z-index:50;width:42px;height:42px;bottom:0;opacity:.16;pointer-events:none}
.corner.right{right:0;background:linear-gradient(135deg,transparent 49%,#e3bd54 50%)}
.corner.left{left:0;background:linear-gradient(225deg,transparent 49%,#e3bd54 50%)}
.status{position:relative;z-index:3;margin:0;color:#8b7951;font-size:10px;letter-spacing:.12em}
.measure{position:absolute!important;left:-99999px!important;top:0!important;width:500px!important;height:690px!important;visibility:hidden!important;pointer-events:none!important}
@media(max-width:850px){
  .book{width:min(500px,94vw);height:min(690px,calc(100svh - 82px))}
  .book:not(.closed){width:min(500px,94vw)}
  .sheet{width:100%}
  .paper{padding:42px 34px 34px}
  .flow p{font-size:17px;line-height:1.8}
  .flow h2{font-size:21px}
  .diary-hint{display:none}
}
</style>
</head>
<body>
<main class="diary-shell">
  <a class="diary-return" href="/extras/">← 返回番外</a>
  <div class="diary-hint">拖动页角翻页 · ← →</div>
  <section class="stage"><div id="book" class="book closed"></div></section>
  <p id="status" class="status">封面</p>
</main>
<script>
const entries=[
["■年6月6日",["命运将一个拥有红宝石般眼眸的猎人送至我面前。他的血液出乎意料地难以入口，不过，那顽强的自愈之力，以及「小刀」前所未有的悸动，都昭示了他的不同寻常。","姑且尝试一次“初拥”的仪式吧。","或许，我终于能够塑造出自己一直寻找的某种可能。","就称他为“66号”。"]],
["■年7月20日",["一个多月过去，66号的转化已经基本稳定。更令人惊讶的是，他竟然能够沐浴阳光而毫发无伤。","这超越了我对血族的认知。","他拥有远比我最初预想中更加惊人的潜质。或许是时候让他知道，作为我的后裔究竟应该成为什么样的人了。","我要让他足够强大，强大到再也不会轻易被谁伤害，最终成为能够与我并肩的存在。","至于为此必须经历的那些痛苦……","总有一天，他会理解的吧。"]],
["■年8月27日",["真让人发愁。","这段时间，66号越来越习惯城堡里的生活，却没有因此变得更加听话。他还是会偷偷离开，会把武器藏在我找不到的地方，也依然毫不掩饰自己想杀我的念头。","今天的事情更是荒唐。","他一定是在外面与那些粗鄙之徒厮混惯了，才会如此不知廉耻地张开腿给我看。","而我大概也疯了。","看见他的脸，就无法保持理智。","或许真的是那杯被动过手脚的血液在作祟。","可他的身体、声音、气味，甚至那双充满憎恨地盯着我的眼睛，都让我感到一种久违的灼热。"]],
["■年9月12日",["最近，66号偶尔会允许我留在他的房间。","说是“允许”或许并不准确。他只是懒得再把我赶出去，仍旧会在床底藏着武器，也从没有停止提防我。","睡着的时候倒是很安静。","有时我会想，如果「你」能够活到今日，或许也已经是这样的年纪。","可是你属于阳光。","像我这样背负罪孽的怪物，从来没有资格奢望你留在身边。","而66号就在这里。","我伸手便能够碰到他。","有那么一刻，我竟然对所谓的命运生出了感谢。"]],
["■年10月16日",["无论我如何做，66号始终不肯真正屈从。","我原本以为，只要给予足够的力量、足够长久的生命，以及任何人都无法夺走的地位，他迟早会理解我的选择。","看来是我想错了。","如果他真的如此厌恶我，在那座废弃教堂里，在鬼神共同注视的祭坛前，又为什么主动吻我？","更让我无法理解的是，在那之后，他明明已经得到离开的机会，却还是留了下来。","他究竟在想什么？","我已经越来越看不懂他了。"]],
["■年10月31日",["66号仍旧没有离开。","他开始插手血仆的去留，干涉协会的事务，甚至对我该不该杀人指手画脚。有时候我会觉得，我培养的根本不是什么听话的后裔，而是一个专门与我作对的麻烦。","可我似乎已经习惯了这个麻烦。","还有很多事情没有完成。","手臂上来自恶魔的印记时时刻刻提醒着我，我能够维持自己意志的时间并不会无限延长。","在“大蛇”真正吞噬我以前，我必须让66号拥有能够独自活下去的力量。"]],
["■年12月15日",["冬天已经来了。","城堡比过去安静许多。那些孩子陆续离开以后，走廊里再也听不到从前那样杂乱的脚步声。66号倒还是一样，偶尔回来，偶尔消失，仿佛从来不觉得有向我说明去处的必要。","我最真实的愿望，不过是他能够保护自己。","活得比任何人都久一些。","如果还能继续像现在这样，对那些孩子露出笑容，那就更好了。","曾经，我也这样希望过「你」。","说到底，我仍然只是那个无法以真正面目示人的怪物，只能靠着过去的回忆勉强生活。","我曾以为自己能够塑造66号。","如今看来，或许恰恰相反。","他正在变成一个连我也无法控制的人。","这大概也是好事。","我能够为他做的，或许只剩下一件事——成为他走向不朽之前的一块踏脚石。","即使最后因此万劫不复。","「你」如果能够看见今日的我，会不会也觉得这样的感情十分可悲？"]]
];

async function init(){
 if(document.fonts&&document.fonts.ready) await document.fonts.ready;
 const book=document.getElementById('book'),status=document.getElementById('status');

 // paginate by actual rendered height
 const m=document.createElement('div');m.className='face page measure';
 m.innerHTML='<article class="paper"><div class="flow"></div></article>';document.body.appendChild(m);
 const flow=m.querySelector('.flow'),paper=m.querySelector('.paper');
 const fits=h=>{flow.innerHTML=h;return paper.scrollHeight<=paper.clientHeight+1};
 const pages=[];let blocks=[];
 const flush=()=>{if(blocks.length){pages.push(blocks.join(''));blocks=[]}};
 const addRaw=h=>{if(fits(blocks.concat(h).join(''))){blocks.push(h);return true}return false};

 function addPara(text){
   if(addRaw('<p>'+text+'</p>'))return;
   if(blocks.length){
     const ch=Array.from(text);let lo=1,hi=ch.length,best=0;
     while(lo<=hi){const mid=(lo+hi)>>1;if(fits(blocks.concat('<p>'+ch.slice(0,mid).join('')+'</p>').join(''))){best=mid;lo=mid+1}else hi=mid-1}
     if(best>0){let cut=best,from=Math.max(0,Math.floor(best*.68)),probe=ch.slice(from,best).join(''),mm=[...probe.matchAll(/[，。！？；、…]/g)];if(mm.length)cut=from+mm[mm.length-1].index+1;blocks.push('<p>'+ch.slice(0,cut).join('')+'</p>');flush();text=ch.slice(cut).join('')}else flush();
   }
   while(text){
     const ch=Array.from(text);
     if(addRaw('<p class="continued">'+text+'</p>'))break;
     let lo=1,hi=ch.length,best=0;
     while(lo<=hi){const mid=(lo+hi)>>1;if(fits(blocks.concat('<p class="continued">'+ch.slice(0,mid).join('')+'</p>').join(''))){best=mid;lo=mid+1}else hi=mid-1}
     if(best<=0){flush();continue}
     let cut=best,from=Math.max(0,Math.floor(best*.68)),probe=ch.slice(from,best).join(''),mm=[...probe.matchAll(/[，。！？；、…]/g)];if(mm.length)cut=from+mm[mm.length-1].index+1;
     blocks.push('<p class="continued">'+ch.slice(0,cut).join('')+'</p>');flush();text=ch.slice(cut).join('');
   }
 }
 entries.forEach(([date,ps])=>{const head='<h2>＜'+date+'＞</h2>',first=ps[0]||'',group=head+(first?'<p>'+first+'</p>':'');if(!addRaw(group)){flush();if(!addRaw(group)){blocks.push(head);if(first)addPara(first)}}for(let i=1;i<ps.length;i++)addPara(ps[i])});
 flush();m.remove();

 const physical=pages.map((html,i)=>({html,num:i+1,blank:false}));
 if(physical.length%2===1)physical.push({html:'',num:null,blank:true});
 physical.push({html:'',num:null,blank:true},{html:'',num:null,blank:true});

 const face=(p,back=false)=>'<div class="face '+(back?'back ':'front ')+'page'+(p&&p.blank?' blank':'')+'"><article class="paper">'+(p&&p.html?'<div class="flow">'+p.html+'</div>':'')+'</article>'+(p&&p.num?'<span class="folio">'+p.num+'</span>':'')+'</div>';
 book.innerHTML='';
 const first=document.createElement('div');first.className='sheet';
 first.innerHTML='<div class="face front cover"><div class="cover-inner"><small>PRIVATE RECORD · ZENOBIA</small><h1>甜美公爵的<br>私人日记</h1><div class="ruby"></div></div></div>'+face(physical[0],true)+'<i class="corner right"></i>';book.appendChild(first);
 for(let i=1;i<physical.length;i+=2){const s=document.createElement('div');s.className='sheet';s.innerHTML=face(physical[i],false)+face(physical[i+1],true)+'<i class="corner right"></i><i class="corner left"></i>';book.appendChild(s)}

 const sheets=[...book.querySelectorAll('.sheet')];let cur=0,startX=0,active=null,mode='',moved=0;
 function render(){
   sheets.forEach((s,i)=>{const f=i<cur;s.classList.toggle('flipped',f);if(!s.classList.contains('dragging'))s.style.transform=f?'rotateY(-180deg)':'rotateY(0deg)';s.style.zIndex=f?String(i+1):String(sheets.length-i)});
   book.classList.toggle('closed',cur===0);
   status.textContent=cur===0?'封面':((cur-1)*2+1>pages.length?'空白页':Math.min(cur*2,pages.length)+' / '+pages.length);
 }
 const next=()=>{if(cur<sheets.length){cur++;render()}},prev=()=>{if(cur>0){cur--;render()}};
 const px=e=>e.clientX;
 book.addEventListener('pointerdown',e=>{const r=book.getBoundingClientRect(),x=px(e)-r.left;startX=px(e);moved=0;const mobile=innerWidth<=850,right=mobile?x>r.width*.35:x>r.width/2;if(right&&cur<sheets.length){active=sheets[cur];mode='next'}else if(!right&&cur>0){active=sheets[cur-1];mode='prev'}else return;active.classList.add('dragging');active.style.zIndex=String(sheets.length+5);book.setPointerCapture?.(e.pointerId)});
 book.addEventListener('pointermove',e=>{if(!active)return;const dx=px(e)-startX;moved=Math.max(moved,Math.abs(dx));const w=book.getBoundingClientRect().width*(innerWidth<=850?1:.5);if(mode==='next')active.style.transform='rotateY('+Math.max(-180,Math.min(0,dx/w*180))+'deg)';else active.style.transform='rotateY('+(-180+Math.max(0,Math.min(180,dx/w*180)))+'deg)'});
 const end=e=>{if(!active)return;const dx=px(e)-startX,thr=book.getBoundingClientRect().width*(innerWidth<=850 ? .16 : .10);active.classList.remove('dragging');active.style.transform='';if(mode==='next'&&dx<-thr)cur=Math.min(sheets.length,cur+1);else if(mode==='prev'&&dx>thr)cur=Math.max(0,cur-1);active=null;render()};
 book.addEventListener('pointerup',end);book.addEventListener('pointercancel',end);
 book.addEventListener('click',e=>{if(moved>10)return;const r=book.getBoundingClientRect(),x=e.clientX-r.left;if(innerWidth<=850||x>r.width/2)next();else prev()});
 addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
 render();
}
init();
</script>
</body>
</html>
