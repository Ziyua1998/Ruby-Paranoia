<script>
const entries=[
["■年6月6日",["命运将一个拥有红宝石般眼眸的猎人送至我面前。他的血液出乎意料地难以下咽，可那顽强的自愈能力，以及「小刀」从未有过的反应，都昭示了他的不同寻常。","姑且一试那“初拥”的仪式吧。或许，就能塑造出我自己一直寻找的某种可能。","就称他为“66号”。"]],
["■年7月20日",["一个多月了才发现，66号竟然能够沐浴在阳光下而毫发无伤，这超越了我对血族的认知，也让我看到了他惊人的潜质。或许是时候让他知晓，身为我的后裔所要肩负的真正使命了。","我要将他打造成这永夜中最美丽的杰作，培养成足以与我并肩，维护这世间正义的存在。至于为这份‘恩赐’必须经历的那些痛苦……总有一天，他会理解的。"]],
["■年8月27日",["真让人发愁。66号还是想杀我。","今天的事更是荒唐。他一定与和外面的那些粗鄙之徒厮混惯了，才会如此不知廉耻地张开腿给我看。而我大概也是疯了，只要看见他的脸，就无法自持。","或许真是那杯被动过手脚的血液在作祟。","但他的身体、声音、气味，乃至充满憎恨的眼神，都让我感受到一种久违的灼热……"]],
["■年9月12日",["最近，66号偶尔会允许我留在他的房间，不过也从没有停止提防我。","他睡着的时候倒很安静。那让我想起，如果「你」活到今天，大概也会是这般模样。","但「你」属于阳光，是像我这样满身罪孽的怪物永远无法奢望的。而66号就躺在我触手可及的地方。有那么一刻，我对命运产生了荒谬的感激。"]],
["■年10月16日",["无论我如何做，66号始终不肯真正屈从。他真的如此厌恶我吗？若真是如此，在那座废弃的教堂里，在鬼神共同注视的祭坛上，他又为什么主动吻我？","算了。我已不想深究。那在暗处窥视的卑劣人类已经将我们的结合公之于众，今后，无论他是否情愿留在我身边，都将与我一同沉沦。"]],
["■年10月31日",["66号仍旧没有离开。有时候我会觉得，我培养了一个专门与我作对的麻烦。而我似乎已经习惯了。","还有太多的事要做。恶魔留下的痕迹时时刻刻提醒着我，自己的意志未必还能维持多久。在被“大蛇”完全吞噬之前，必须加快速度，为66号铺平道路……"]],
["■年12月15日",["我真正希望的，不过是66号能够保护自己，活得比任何人都久一些，继续对着那些小孩子露出笑容。这也是曾经我希望的「你」的人生。说到底，我还是那个始终不敢以真面目示人、靠着回忆饮鸩止渴的怪物。","我曾以为自己能够塑造66号，可如今恰恰相反，他正在变得更强大。我能替他做的，大概只剩下一件事——成为他通往不朽的踏脚石。即使我将万劫不复。","「你」倘若能看见今日的情景，是否也会为我这扭曲的感情，而感到悲哀？"]]
];

function navLink(to,label){return `<a href="${to}" class="${path===to?'active':''}">${label}</a>`}

function home(){return `<section class="hero"><div class="hero-architecture"><i></i><i></i><i></i></div><div class="hero-copy"><div class="eyebrow">A GOTHIC FANWORK BY ZENOBIA</div><h1><span>Ruby</span><span>Paranoia</span></h1><h2>深红偏执</h2><div class="rule"></div><p>这是一个围绕吸血鬼、猎人、记忆、控制与选择展开的 One Punch Man 同人故事。</p><div class="hero-meta"><span>AMAI MASK × ZOMBIEMAN</span><b>◆</b><span>ONGOING</span></div><a class="enter-link" href="#archive">ENTER THE ARCHIVE <span>↓</span></a></div><figure class="hero-cover"><div class="book-frame"><div class="cover-art"><span class="cover-by">By Zenobia</span><div class="cover-title">Ruby<br>Paranoia</div><div class="cover-sword"><i></i></div><div class="cover-bats"><b></b><b></b><b></b></div><span class="cover-sub">AMAI MASK × ZOMBIEMAN<br>ONE PUNCH MAN FANBOOK</span></div></div><figcaption>BOOK DESIGN · ZENOBIA</figcaption></figure></section><section class="manifesto"><div class="manifesto-mark">✦</div><p>“红宝石”既是记忆的残片，也是无法被安静埋葬的偏执。这里收录正文之外的世界设定、音乐影像与番外档案。</p></section><section class="section" id="archive"><div class="section-title"><span>ARCHIVE INDEX</span><h2>作品档案</h2><p>Choose a sealed file</p></div><div class="portal-grid"><a class="card" href="/world/"><span class="n">01</span><div class="sigil">♜</div><small>WORLD ARCHIVE</small><h3>世界观设定</h3><p>血族秩序、人类势力与既有规则档案。</p><span class="go">阅览档案 →</span></a><a class="card" href="/media/"><span class="n">02</span><div class="sigil">◉</div><small>MEDIA VAULT</small><h3>歌曲 / 视频</h3><p>与作品相关的声音与影像陈列。</p><span class="go">阅览档案 →</span></a><a class="card" href="/extras/"><span class="n">03</span><div class="sigil">✒</div><small>EXTRA FILES</small><h3>附录与番外</h3><p>主线之外，被封存的故事与私人记录。</p><span class="go">阅览档案 →</span></a><a class="card" href="/extras/diary/"><span class="n">04</span><div class="sigil">▣</div><small>PRIVATE DIARY</small><h3>甜公日记</h3><p>翻阅甜公留下的羊皮纸日记。</p><span class="go">阅览档案 →</span></a></div></section><section class="book-object"><div class="book-object-copy"><span>PHYSICAL EDITION CONCEPT</span><h2>像一本被遗忘在古堡里的书。</h2><p>网页视觉从小说封面延伸：黑色作为空间，深红作为血液与执念，暗金作为烛火、旧金属与纸张边缘的光。</p></div><div class="book-object-visual"><div class="mock-book mock-book-back"><span>RUBY PARANOIA</span></div><div class="mock-book mock-book-spine"><span>Ruby Paranoia</span></div><div class="mock-book mock-book-front"><span class="tiny">BY ZENOBIA</span><strong>Ruby<br>Paranoia</strong></div></div></section>`}
function archiveHero(kicker,title,desc){return `<section class="archive-hero"><i class="arch a"></i><i class="arch b"></i><i class="arch c"></i><header class="page-title"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></header></section>`}
function world(){const rows=[["I","♛","血族秩序","血族社会存在“长亲—后裔—血仆”等关系结构。","不同血族对人类立场并不一致：有力量统治派，也有强调力量与责任对应、维持族群平衡的一派。甜美公爵处在两者之间，认为利用人类可以接受，但必须受到约束。"],["II","⛨","人类势力","人类侧存在教会、骑士团、血猎／猎人组织等力量。","这些势力与血族彼此对立，却也并非铁板一块。"],["III","✦","初拥与后裔","“初拥”会把人类转化为血族后裔。","66号是甜美公爵第一个成功完成初拥并存活的人类，并保留了日光耐受与强自愈等异常特性。"],["IV","◆","血液与生存","血族获取血液的方式包括收买血仆、圈养人畜、外出捕猎，以及介入人类战争。",""],["V","♜","权力结构","血族协会由玛考伊建立，本部位于 V 市。","协会通过议会协调血族精英，并输出可能影响人类命运的决策。"]];return `${archiveHero("WORLD DOSSIER · ZENOBIA","世界观设定","现阶段已确认的秩序、阵营与生存法则。")}<div class="archive-band"><span>ARCHIVE NO. 01</span><b>◆</b><span>VAMPIRE SOCIETY</span><b>◆</b><span>ONGOING RECORD</span></div><article class="page"><div class="dossiers">${rows.map(r=>`<section class="dossier"><header><span>${r[0]}</span><span>${r[1]}</span></header><h2>${r[2]}</h2><p>${r[3]}</p>${r[4]?`<p>${r[4]}</p>`:''}</section>`).join('')}</div><p class="note">以正文为准，后续随连载更新。</p></article>`}
function media(){return `${archiveHero("SOUND & VISION · ZENOBIA","歌曲 / 视频","声音与影像将在此处依次归档。")}<div class="archive-band"><span>ARCHIVE NO. 02</span><b>◆</b><span>AUDIO / FILM</span><b>◆</b><span>SEALED MATERIAL</span></div><div class="page"><div class="media-grid"><section class="media-box"><div class="media-art">◉</div><div><span>SECTION I · AUDIO</span><h2>歌曲</h2><p>档案尚未公开。未来将在这里陈列与作品相关的歌曲、主题曲与音频。</p><small>COMING SOON</small></div></section><section class="media-box"><div class="media-art film">▤</div><div><span>SECTION II · FILM</span><h2>视频</h2><p>影像卷宗仍在封存。未来可直接嵌入 Bilibili / YouTube 等公开视频。</p><small>COMING SOON</small></div></section></div></div>`}
function extras(){return `${archiveHero("APPENDICES · ZENOBIA","附录与番外档案","主线之外，仍被纸页与封蜡保存的记录。")}<div class="archive-band"><span>ARCHIVE NO. 03</span><b>◆</b><span>PRIVATE RECORDS</span><b>◆</b><span>APPENDICES</span></div><div class="page"><div class="extras"><a class="extra featured" href="/extras/diary/"><span class="idx">EX — 01</span><span class="extra-diary-book"></span><div><small>可阅览档案</small><h2>甜公的日记</h2><p>以可翻阅的中世纪羊皮纸日记形式呈现的私人记录。支持鼠标拖拽页角、点击翻页、方向键与移动端滑动。</p></div><span class="state">开启日记 →</span></a><article class="extra"><span class="idx">EX — 02</span><span class="glyph">⚿</span><div><small>番外档案</small><h2>井中的新娘</h2><p>一段发生在主线之前的旧事，关于被凝视、被安排的人生，与一次拒绝。</p></div><span class="state">封存</span></article><article class="extra muted"><span class="idx">EX — ··</span><span class="glyph">◌</span><div><small>待归档</small><h2>更多番外</h2><p>将随连载补充。</p></div></article></div></div>`}
function diary(){return `<main class="diary-shell season-summer"><a class="diary-return" href="/extras/">← 返回番外</a><div class="diary-hint">拖动页角翻页 · ← →</div><section class="diary-stage"><div id="diary-book" class="diary-book"><div class="diary-cover" data-density="hard"><div class="diary-cover-inner"><small>PRIVATE RECORD · ZENOBIA</small><h1>甜公的日记</h1><div class="diary-ruby"></div></div></div></div></section><p class="page-status">封面</p></main>`}
const app=document.getElementById('app');if(path==='/extras/diary/'){app.innerHTML=diary();if(document.fonts&&document.fonts.ready){document.fonts.ready.then(initDiary)}else{initDiary()}}else{let c=path==='/world/'?world():path==='/media/'?media():path==='/extras/'?extras():home();app.innerHTML=shell(c);initSite()}
function initSite(){const s=document.querySelector('[data-share]');if(s)s.onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,text:'RUBY PARANOIA / One Punch Man',url:location.href});else{await navigator.clipboard.writeText(location.href);s.textContent='✓';setTimeout(()=>s.textContent='↗',1500)}}catch(e){}};const m=document.querySelector('[data-menu]'),n=document.querySelector('.mobile-nav');if(m&&n)m.onclick=()=>{n.hidden=!n.hidden;m.textContent=n.hidden?'☰':'×'}}
function initDiary(){
  const shell=document.querySelector('.diary-shell');
  const book=document.getElementById('diary-book');
  const status=document.querySelector('.page-status');
  if(!book)return;
  if(!window.St||!window.St.PageFlip){status.textContent='翻页组件加载失败，请刷新页面';return}

  // Measure the actual rendered text at the logical PageFlip page size.
  const measure=document.createElement('div');
  measure.className='diary-page right diary-measure';
  measure.innerHTML='<div class="paper-grain"></div><article class="diary-paper"><div class="diary-flow"></div></article>';
  document.body.appendChild(measure);
  const measureFlow=measure.querySelector('.diary-flow');
  const measurePaper=measure.querySelector('.diary-paper');

  const fits=(html)=>{
    measureFlow.innerHTML=html;
    return measurePaper.scrollHeight<=measurePaper.clientHeight+1;
  };

  const pages=[];
  let blocks=[];
  const flush=()=>{
    if(blocks.length){pages.push(blocks.join(''));blocks=[]}
  };
  const tryAdd=(html)=>{
    const candidate=blocks.concat(html).join('');
    if(fits(candidate)){blocks.push(html);return true}
    return false;
  };

  // Add a paragraph, splitting only when the remaining physical space truly requires it.
  const addParagraph=(text)=>{
    const whole='<p>'+text+'</p>';
    if(tryAdd(whole))return;
    if(blocks.length) {
      // First try to use the remainder of the current page instead of wasting it.
      let chars=Array.from(text), lo=1, hi=chars.length, best=0;
      while(lo<=hi){
        const mid=(lo+hi)>>1;
        const html='<p>'+chars.slice(0,mid).join('')+'</p>';
        if(fits(blocks.concat(html).join(''))){best=mid;lo=mid+1}else hi=mid-1;
      }
      if(best>0){
        // Prefer a natural punctuation break near the measured boundary.
        let cut=best;
        const probe=chars.slice(Math.max(0,Math.floor(best*.62)),best).join('');
        const matches=[...probe.matchAll(/[，。！？；、…]/g)];
        if(matches.length){
          const base=Math.max(0,Math.floor(best*.62));
          cut=base+matches[matches.length-1].index+1;
        }
        blocks.push('<p>'+chars.slice(0,cut).join('')+'</p>');
        flush();
        text=chars.slice(cut).join('');
      }else{
        flush();
      }
    }
    while(text){
      const chars=Array.from(text);
      const full='<p class="continued">'+text+'</p>';
      if(tryAdd(full))break;
      let lo=1,hi=chars.length,best=0;
      while(lo<=hi){
        const mid=(lo+hi)>>1;
        const html='<p class="continued">'+chars.slice(0,mid).join('')+'</p>';
        if(fits(blocks.concat(html).join(''))){best=mid;lo=mid+1}else hi=mid-1;
      }
      if(best<=0){flush();continue}
      let cut=best;
      const probe=chars.slice(Math.max(0,Math.floor(best*.62)),best).join('');
      const matches=[...probe.matchAll(/[，。！？；、…]/g)];
      if(matches.length){
        const base=Math.max(0,Math.floor(best*.62));
        cut=base+matches[matches.length-1].index+1;
      }
      blocks.push('<p class="continued">'+chars.slice(0,cut).join('')+'</p>');
      flush();
      text=chars.slice(cut).join('');
    }
  };

  entries.forEach(([date,paras])=>{
    const heading='<h2 class="diary-date">＜'+date+'＞</h2>';
    const first=paras[0]||'';
    const firstGroup=heading+(first?'<p>'+first+'</p>':'');
    // Keep a date with its opening paragraph; if they do not fit together, start them on the next page.
    if(!tryAdd(firstGroup)){
      flush();
      if(!tryAdd(firstGroup)){
        blocks.push(heading);
        if(first)addParagraph(first);
      }
    }
    for(let i=1;i<paras.length;i++)addParagraph(paras[i]);
  });
  flush();
  measure.remove();

  const contentCount=pages.length;
  pages.forEach((html,i)=>{
    const page=document.createElement('div');
    page.className='diary-page '+(i%2===0?'left':'right');
    const ratio=i/Math.max(1,contentCount-1);
    page.dataset.season=ratio>.82?'winter':ratio>.48?'autumn':ratio>.26?'late-summer':'summer';
    page.innerHTML='<div class="paper-grain"></div><article class="diary-paper"><div class="diary-flow">'+html+'</div></article><span class="folio">'+(i+1)+'</span>';
    book.appendChild(page);
  });

  // Guarantee a full blank spread after the last written page.
  let logicalCount=contentCount;
  if(logicalCount%2===1){
    const filler=document.createElement('div');
    filler.className='diary-page right diary-blank';
    filler.dataset.season='winter';
    filler.innerHTML='<div class="paper-grain"></div><article class="diary-paper"></article>';
    book.appendChild(filler);
    logicalCount++;
  }
  for(let i=0;i<2;i++){
    const blank=document.createElement('div');
    blank.className='diary-page '+(i===0?'left':'right')+' diary-blank';
    blank.dataset.season='winter';
    blank.innerHTML='<div class="paper-grain"></div><article class="diary-paper"></article>';
    book.appendChild(blank);
  }
  const back=document.createElement('div');
  back.className='diary-back';
  back.dataset.density='hard';
  book.appendChild(back);

  const pageFlip=new window.St.PageFlip(book,{
    width:500,height:690,size:'stretch',minWidth:315,maxWidth:500,minHeight:435,maxHeight:690,
    showCover:true,usePortrait:true,mobileScrollSupport:true,drawShadow:true,maxShadowOpacity:.82,
    flippingTime:1050,useMouseEvents:true,swipeDistance:24,showPageCorners:true,autoSize:true,startZIndex:10
  });
  pageFlip.loadFromHTML(book.children);

  const update=(idx)=>{
    if(idx===0){status.textContent='封面';shell.className='diary-shell season-summer';return}
    const node=book.children[idx];
    if(node?.classList.contains('diary-back')){status.textContent='封底';shell.className='diary-shell season-winter';return}
    if(node?.classList.contains('diary-blank')){status.textContent='空白页';shell.className='diary-shell season-winter';return}
    const season=node?.dataset.season||'summer';
    shell.className='diary-shell season-'+season;
    status.textContent=Math.min(idx,contentCount)+' / '+contentCount;
  };
  pageFlip.on('flip',e=>update(e.data));
  window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pageFlip.flipNext();if(e.key==='ArrowLeft')pageFlip.flipPrev()});
  update(0);
}
</script><script src="/assets/music-player.js" defer></script>
</body></html>
